name: pulse

services:
  opengsc:
    build:
      context: ./opengsc-repo
      dockerfile: Dockerfile
    container_name: opengsc
#    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      PORT: "4017"
      DATABASE_URL: "file:/data/prod.db"
      NEXTAUTH_URL: "${NEXTAUTH_URL:-http://localhost:4017}"
    ports:
      - "4017:4017"
    volumes:
      - opengsc-data:/data

  pulse-app:
    build:
      context: ./pulse-app
      dockerfile: Dockerfile
    container_name: pulse-app
#    restart: unless-stopped
    depends_on:
      - opengsc
    env_file:
      - ./.env
    environment:
      PORT: "4018"
      SEO_DB: "/data/opengsc/prod.db"
      RESEARCH_DB: "/data/audit/research.db"
      REPORTS_DIR: "/data/reports"
      DATAFORSEO_LOGIN: "${DATAFORSEO_LOGIN}"
      DATAFORSEO_PASSWORD: "${DATAFORSEO_PASSWORD}"
      DATAFORSEO_KILL_SWITCH: "${DATAFORSEO_KILL_SWITCH:-0}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4018:4018"
    volumes:
      - opengsc-data:/data/opengsc:ro
      - audit-data:/data/audit
      - audit-reports:/data/reports


  pulse-worker:
    build:
      context: ./pulse-app
      dockerfile: Dockerfile
    container_name: pulse-worker
    depends_on:
      - opengsc
    env_file:
      - ./.env
    environment:
      SEO_DB: "/data/opengsc/prod.db"
      RESEARCH_DB: "/data/audit/research.db"
      REPORTS_DIR: "/data/reports"
      DATAFORSEO_LOGIN: "${DATAFORSEO_LOGIN}"
      DATAFORSEO_PASSWORD: "${DATAFORSEO_PASSWORD}"
      DATAFORSEO_KILL_SWITCH: "${DATAFORSEO_KILL_SWITCH:-0}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "-m", "jobs.worker"]
    volumes:
      - opengsc-data:/data/opengsc:ro
      - audit-data:/data/audit
      - audit-reports:/data/reports

volumes:
  opengsc-data:
    name: seo-aeo-geo-suite_opengsc-data
  audit-data:
    name: seo-aeo-geo-suite_audit-data
  audit-reports:
    name: seo-aeo-geo-suite_audit-reports
