<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}SEO / GEO / AEO Dashboard{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
<header class="topbar">
  <div class="brand">SEO / GEO / AEO</div>
  {% if sites %}
  <form class="domain-picker" onsubmit="return false">
    <label for="siteSelect">Domain</label>
    <select id="siteSelect" onchange="location.href='/d/'+this.value+'/'">
      {% for s in sites %}
      <option value="{{ s.domain }}" {% if site and s.domain == site.domain %}selected{% endif %}>{{ s.domain }}</option>
      {% endfor %}
    </select>
  </form>
  {% endif %}
</header>

{% if site %}
<nav class="nav">
  <a class="{% if request.endpoint == 'overview' %}active{% endif %}" href="{{ url_for('overview', domain=site.domain) }}">Overview</a>
  <a class="{% if request.endpoint in ['reports','report_session_view','report_session_pdf'] %}active{% endif %}" href="{{ url_for('reports', domain=site.domain) }}">Reports</a>
  <a class="{% if request.endpoint == 'domain_sources' %}active{% endif %}" href="{{ url_for('domain_sources', domain=site.domain) }}">Sources</a>

  <a class="{% if request.endpoint == 'domain_settings' %}active{% endif %}" href="{{ url_for('domain_settings', domain=site.domain) }}">Settings</a>
  <a class="{% if request.endpoint in ['tools','geo_aeo_integrated','seo_crawl','seo_crawl_run','seo_crawl_status','pages','page','page_workspace','keywords_dashboard','keywords','wanted','research','keyword_workspace'] or (request.endpoint and request.endpoint.startswith('dataforseo_')) %}active{% endif %}" href="{{ url_for('tools', domain=site.domain) }}">Tools</a>
  <a class="{% if request.endpoint == 'domain_new' %}active{% endif %}" href="{{ url_for('domain_new') }}">+ Domain</a>
</nav>
{% endif %}

<main class="shell">


{% block content %}{% endblock %}
</main>
  <script src="{{ url_for('static', filename='sortable.js') }}"></script>
  <script src="{{ url_for('static', filename='collapsible-notes.js') }}"></script>
  <script src="{{ url_for('static', filename='taxonomy.js') }}"></script>
  <script src="{{ url_for('static', filename='nav-keyword-links.js') }}"></script>
  <script src="{{ url_for('static', filename='page-geo-aeo.js') }}"></script>
</body>
</html>
