<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ domain }} · Pulse client report</title>
  <link rel="stylesheet" href="{{ url_for('public_report_static', filename='app.css') }}">
</head>
<body>
  <main class="shell" style="max-width:560px;padding-top:10vh">
    <section class="panel">
      <p class="eyebrow">PULSE CLIENT REPORT</p>
      <h1>{{ domain }}</h1>
      <p>This report is password protected.</p>
      {% if error %}<p class="notice">{{ error }}</p>{% endif %}
      <form method="post">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
        <label>Password <input type="password" name="password" required autofocus autocomplete="current-password"></label>
        <p><button class="primary" type="submit">Open report</button></p>
      </form>
    </section>
  </main>
</body>
</html>
